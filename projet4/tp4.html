    <header>
        <h1>Formulaire d'inscription</h1>
<form action="traitement.php" method="post">
    <div class="encadre">
    <h2>👤 Informations personnelles</h2>
    <fieldset>
    <label for="nom">Nom:</label>
    <input type="text" id="nom" name="nom" placeholder="tapez votre nom"><br><br>
    <label for="prenom">Prénom:</label>
    <input type="text" id="prenom" name="prenom" placeholder="tapez votre prénom"><br><br>
    <label for="date_naissance">Date de naissance:</label>
    <input type="date" id="date_naissance" name="date_naissance"><br><br>
    </fieldset>
    <h2>📧 Coordonnées</h2>
    <fieldset>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="tapez votre email"><br><br>
    <label for="mdp">Mot de passe:</label>
    <input type="password" id="mdp" name="mdp" placeholder="choisissez votre mot de passe"><br><br>
   <div class="encadre">
    </fieldset>
    <h2>🚗 Informations conducteur</h2>
    <fieldset>
    <label for="permis">Permis de conduire:</label>
    <input type="checkbox" id="permis" name="permis"><br><br>
    <label for="anciennete">Ancienneté:</label>
    <input type="number" id="anciennete" name="anciennete" min="0" max="80" placeholder="tapez votre anciennté"><br><br>
    <label for="ville">Ville:</label>
    <select id="ville" name="ville">
        <option value="paris">Paris</option>
        <option value="lyon">Lyon</option>
        <option value="versaille">Versailles</option>
        <option value="creteil">Créteil</option>
    </select><br><br>
    <label for="adresse">Adresse du client:</label>
    <textarea id="adresse" name="adresse" rows="4" cols="30" placeholder="tapez votre adresse"></textarea><br><br>
<p>Situation Matrimoniale:</p>
<label for="marie_oui" id ="marie_oui">
    <input type="radio" id="marie_oui" name="situation" value="oui">
    Marié(e)
</label>
<label for="marie_non" id ="marie_non">
    <input type="radio" id="marie_non" name="situation" value="non">
    Célibataire
</label><br><br>
<p>Preference de voiture</p>
<label for="pref_auto">
    <input type="checkbox" id="pref_auto" name="pref_auto">
    Automatique
</label> <br>
<label for="pref_manuelle">
    <input type="checkbox" id="pref_manuelle" name="pref_manuelle">
    Manuelle
</label><br><br>
    </fieldset>
<button type="submit" value="Enregistrer">Enregistrer</button>
<button type="reset" value="Annuler">Annuler</button><br><br>
<input type="submit" value="Envoyer">
